[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dingir"
version = "0.5.3"
description = "The Django-grade stateless multi-agent orchestration and contextual data store engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.41.1",
    "google-genai>=2.8.0",
    "ollama>=0.6.2",
    "huggingface-hub>=1.19.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0"
]

[project.optional-dependencies]
rag = [
    "semchunk>=4.1.1",
    "numpy>=2.4.6",
    "chromadb>=1.5.9"
]

local = [
    "torch>=2.12.0",
    "transformers>=5.12.1",
    "accelerate>=1.14.0"
]

[tool.setuptools]
package-dir = {"dingir" = "src"}
packages = [
    "dingir",
    "dingir.agents",
    "dingir.agents.llms",
    "dingir.agents.stdtools",
    "dingir.agents.stdguards",
    "dingir.rag",
    "dingir.rag.stores",
]

